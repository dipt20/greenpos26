<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Cart Shop - POS System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800">

    <div class="max-w-7xl mx-auto p-3 sm:p-4 lg:p-6">
        <header class="bg-white rounded-2xl p-4 sm:p-6 shadow-xs border border-gray-100 mb-4 sm:mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-xl sm:text-2xl font-bold text-emerald-600 tracking-wide">গ্রীণ কার্ট শপ</h1>
                <p class="text-xs sm:text-sm text-gray-500 mt-1">মোবাইল: ০১৬২৩-৬৭৭-৬৮৭</p>
            </div>
            <div class="text-center sm:text-right w-full sm:w-auto border-t sm:border-t-0 pt-3 sm:pt-0 border-gray-100">
                <p class="text-sm font-medium text-gray-600">ইনভয়েস নং: <span id="invoiceNo" class="font-bold text-gray-900"></span></p>
                <p class="text-xs text-gray-400 mt-1">তারিখ ও সময়: <span id="invoiceTime"></span></p>
            </div>
        </header>

        <div class="flex bg-gray-200 p-1 rounded-xl mb-4 lg:hidden">
            <button id="tabFormBtn" onclick="switchTab('form')" class="w-1/2 text-center py-2 text-sm font-medium rounded-lg bg-white text-emerald-600 shadow-xs cursor-pointer">
                পণ্য ও ক্রেতা ইনপুট
            </button>
            <button id="tabCartBtn" onclick="switchTab('cart')" class="w-1/2 text-center py-2 text-sm font-medium rounded-lg text-gray-600 cursor-pointer flex justify-center items-center gap-1">
                লাইভ বিল মেমো 
                <span id="mobileCartCount" class="bg-emerald-600 text-white text-xs px-1.5 py-0.5 rounded-full hidden">0</span>
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
            
            <div id="leftInputArea" class="lg:col-span-1 space-y-4 sm:space-y-6 block lg:block">
                <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-xs border border-gray-100">
                    <h2 class="text-base sm:text-lg font-semibold text-gray-700 mb-3 sm:mb-4 border-b pb-2 border-gray-100">ক্রেতার তথ্য (ঐচ্ছিক)</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs font-medium text-gray-500 block mb-1">ক্রেতার নাম</label>
                            <input type="text" id="custName" oninput="saveDraft()" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="text-xs font-medium text-gray-500 block mb-1">মোবাইল নাম্বার</label>
                            <input type="text" id="custPhone" oninput="saveDraft()" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="text-xs font-medium text-gray-500 block mb-1">ঠিকানা</label>
                            <textarea id="custAddress" oninput="saveDraft()" rows="2" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500 resize-none"></textarea>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-xs border border-gray-100">
                    <h2 class="text-base sm:text-lg font-semibold text-gray-700 mb-3 sm:mb-4 border-b pb-2 border-gray-100">পণ্য যুক্ত করুন</h2>
                    <form id="productForm" class="space-y-3">
                        <input type="hidden" id="editIndex" value="-1">
                        <div>
                            <label class="text-xs font-medium text-gray-500 block mb-1">পণ্যের নাম</label>
                            <input type="text" id="prodName" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-medium text-gray-500 block mb-1">মূল্য (৳)</label>
                                <input type="number" id="prodPrice" min="0" step="0.01" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="text-xs font-medium text-gray-500 block mb-1">পরিমাণ (Qty)</label>
                                <input type="number" id="prodQty" min="1" value="1" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
                            </div>
                        </div>
                        <button type="submit" id="addBtn" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition duration-200 shadow-xs cursor-pointer">
                            পণ্য যুক্ত করুন
                        </button>
                    </form>
                </div>
            </div>

            <div id="liveCartArea" class="lg:col-span-2 bg-white p-4 sm:p-6 rounded-2xl shadow-xs border border-gray-100 flex flex-col justify-between hidden lg:flex">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-gray-700 mb-4 border-b pb-2 border-gray-100">সব পণ্যের তালিকা (লাইভ মেমো)</h2>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-gray-600">
                            <thead>
                                <tr class="border-b border-gray-100 text-gray-400 uppercase text-xs">
                                    <th class="py-3 pl-2">পণ্য</th>
                                    <th class="py-3 text-center">মূল্য</th>
                                    <th class="py-3 text-center">পরিমাণ</th>
                                    <th class="py-3 text-right pr-2">মোট</th>
                                    <th class="py-3 text-center w-20">অ্যাকশন</th>
                                </tr>
                            </thead>
                            <tbody id="cartTableBody" class="divide-y divide-gray-50">
                                </tbody>
                        </table>
                    </div>
                </div>

                <div class="mt-6 border-t border-gray-100 pt-4 space-y-3">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">সাব-টোটাল:</span>
                        <span class="font-medium text-gray-900">৳<span id="subTotal">0.00</span></span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-500">ডিসকাউন্ট (৳):</span>
                        <input type="number" id="discountInput" value="0" min="0" oninput="calculateTotal()" class="w-20 px-2 py-1 bg-gray-50 border border-gray-200 rounded text-right text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div class="flex justify-between text-base font-bold border-t border-dashed border-gray-200 pt-3 text-gray-900">
                        <span>সর্বমোট মূল্য:</span>
                        <span>৳<span id="grandTotal">0.00</span></span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-4">
                        <button onclick="clearPOS()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium py-3 rounded-xl text-sm transition duration-200 cursor-pointer text-center">
                            সব ক্লিয়ার করুন
                        </button>
                        <button onclick="submitToGoogleSheet()" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm transition duration-200 shadow-sm cursor-pointer text-center">
                            সাবমিট করুন
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 📢 আপনার গুগল অ্যাপস স্ক্রিপ্ট URL এখানে সফলভাবে যুক্ত করা হয়েছে
        var googleScriptURL = 'https://script.google.com/macros/s/AKfycbzXPf9Tk6iYgCVRKxPKpAKlCjdEe5pmU-CYksCWAIOSbt1aJmEF55Mxyd3APm_Sb6LzjA/exec'; 

        let cart = [];

        window.onload = function() {
            if (!localStorage.getItem('invoiceNo')) {
                generateNewInvoice();
            } else {
                document.getElementById('invoiceNo').innerText = localStorage.getItem('invoiceNo');
                document.getElementById('invoiceTime').innerText = localStorage.getItem('invoiceTime');
            }
            
            document.getElementById('custName').value = localStorage.getItem('custName') || '';
            document.getElementById('custPhone').value = localStorage.getItem('custPhone') || '';
            document.getElementById('custAddress').value = localStorage.getItem('custAddress') || '';
            
            if(localStorage.getItem('cart')) {
                cart = JSON.parse(localStorage.getItem('cart'));
            }
            if(localStorage.getItem('discount')) {
                document.getElementById('discountInput').value = localStorage.getItem('discount');
            }
            
            updateCartTable();
        }

        function generateNewInvoice() {
            const randNo = 'GCS-' + Math.floor(100000 + Math.random() * 900000);
            const now = new Date().toLocaleString('bn-BD', { hour12: true });
            localStorage.setItem('invoiceNo', randNo);
            localStorage.setItem('invoiceTime', now);
            document.getElementById('invoiceNo').innerText = randNo;
            document.getElementById('invoiceTime').innerText = now;
        }

        function saveDraft() {
            localStorage.setItem('custName', document.getElementById('custName').value);
            localStorage.setItem('custPhone', document.getElementById('custPhone').value);
            localStorage.setItem('custAddress', document.getElementById('custAddress').value);
            localStorage.setItem('discount', document.getElementById('discountInput').value);
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function switchTab(tab) {
            const leftForm = document.getElementById('leftInputArea');
            const liveCart = document.getElementById('liveCartArea');
            const tabFormBtn = document.getElementById('tabFormBtn');
            const tabCartBtn = document.getElementById('tabCartBtn');

            if (tab === 'form') {
                leftForm.classList.replace('hidden', 'block');
                liveCart.classList.replace('flex', 'hidden');
                tabFormBtn.className = "w-1/2 text-center py-2 text-sm font-medium rounded-lg bg-white text-emerald-600 shadow-xs cursor-pointer";
                tabCartBtn.className = "w-1/2 text-center py-2 text-sm font-medium rounded-lg text-gray-600 cursor-pointer flex justify-center items-center gap-1";
            } else {
                leftForm.classList.replace('block', 'hidden');
                liveCart.classList.replace('hidden', 'flex');
                tabCartBtn.className = "w-1/2 text-center py-2 text-sm font-medium rounded-lg bg-white text-emerald-600 shadow-xs cursor-pointer flex justify-center items-center gap-1";
                tabFormBtn.className = "w-1/2 text-center py-2 text-sm font-medium rounded-lg text-gray-600 cursor-pointer";
            }
        }

        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('prodName').value;
            const price = parseFloat(document.getElementById('prodPrice').value);
            const qty = parseInt(document.getElementById('prodQty').value);
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if(editIndex === -1) {
                cart.push({ name, price, qty });
            } else {
                cart[editIndex] = { name, price, qty };
                document.getElementById('editIndex').value = "-1";
                document.getElementById('addBtn').innerText = "পণ্য যুক্ত করুন";
                document.getElementById('addBtn').className = "w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition duration-200 shadow-xs cursor-pointer";
            }

            document.getElementById('productForm').reset();
            saveDraft();
            updateCartTable();

            if (window.innerWidth < 1024) {
                switchTab('cart');
            }
        });

        function updateCartTable() {
            const tbody = document.getElementById('cartTableBody');
            tbody.innerHTML = '';

            const mobileCounter = document.getElementById('mobileCartCount');
            if(cart.length > 0) {
                mobileCounter.innerText = cart.length;
                mobileCounter.classList.remove('hidden');
            } else {
                mobileCounter.classList.add('hidden');
            }

            if (cart.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-400 text-sm">কার্ট খালি, কোনো পণ্য যোগ করা হয়নি।</td></tr>`;
                calculateTotal();
                return;
            }

            cart.forEach((item, index) => {
                const total = item.price * item.qty;
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50/50">
                        <td class="py-3 pl-2 font-medium text-gray-900 break-all max-w-[120px] sm:max-w-none">${item.name}</td>
                        <td class="py-3 text-center">৳${item.price.toFixed(2)}</td>
                        <td class="py-3 text-center">${item.qty}</td>
                        <td class="py-3 text-right pr-2 font-semibold text-gray-900">৳${total.toFixed(2)}</td>
                        <td class="py-3 text-center space-x-2">
                            <button onclick="editItem(${index})" class="text-blue-600 hover:text-blue-800 font-bold p-1 cursor-pointer">✎</button>
                            <button onclick="removeItem(${index})" class="text-rose-600 hover:text-rose-800 font-bold p-1 cursor-pointer">✕</button>
                        </td>
                    </tr>
                `;
            });

            calculateTotal();
        }

        function calculateTotal() {
            let subTotal = 0;
            cart.forEach(item => { subTotal += (item.price * item.qty); });

            const discount = parseFloat(document.getElementById('discountInput').value) || 0;
            let grandTotal = subTotal - discount;
            if(grandTotal < 0) grandTotal = 0;

            document.getElementById('subTotal').innerText = subTotal.toFixed(2);
            document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
            saveDraft();
        }

        function editItem(index) {
            const item = cart[index];
            document.getElementById('prodName').value = item.name;
            document.getElementById('prodPrice').value = item.price;
            document.getElementById('prodQty').value = item.qty;
            document.getElementById('editIndex').value = index;
            
            document.getElementById('addBtn').innerText = "পরিবর্তন নিশ্চিত করুন";
            document.getElementById('addBtn').className = "w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition duration-200 shadow-xs cursor-pointer";
            
            if (window.innerWidth < 1024) {
                switchTab('form');
            }
        }

        function removeItem(index) {
            if(confirm("আপনি কি নিশ্চিতভাবে এই পণ্যটি মেমো থেকে বাদ দিতে চান?")) {
                cart.splice(index, 1);
                saveDraft();
                updateCartTable();
            }
        }

        function clearPOS() {
            if(confirm("সতর্কতা! আপনি কি নিশ্চিতভাবে সম্পূর্ণ কার্ট এবং ক্রেতার তথ্য মুছে ফেলতে চান?")) {
                forceClear();
            }
        }

        function forceClear() {
            cart = [];
            document.getElementById('productForm').reset();
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('custAddress').value = '';
            document.getElementById('discountInput').value = 0;
            document.getElementById('editIndex').value = "-1";
            document.getElementById('addBtn').innerText = "পণ্য যুক্ত করুন";
            document.getElementById('addBtn').className = "w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition duration-200 shadow-xs cursor-pointer";
            
            localStorage.clear();
            generateNewInvoice();
            updateCartTable();
            
            if (window.innerWidth < 1024) {
                switchTab('form');
            }
        }

        // 🚀 গুগল শিটে ডেটা পাঠানোর ফাংশন
        function submitToGoogleSheet() {
            if (cart.length === 0) {
                alert("কার্ট খালি! সাবমিট করার জন্য পণ্য যোগ করুন।");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "ডাটা পাঠানো হচ্ছে...";
            submitBtn.className = "w-full bg-gray-400 text-white font-bold py-3 rounded-xl text-sm cursor-not-allowed text-center";

            // সব পণ্য এক লাইনে স্ট্রিং আকারে সাজানো
            let productListString = cart.map((item, idx) => `${idx+1}. ${item.name} (${item.qty}টি x ৳${item.price})`).join(' | ');

            // পেলোড তৈরি করা
            const payload = {
                invoice: document.getElementById('invoiceNo').innerText,
                datetime: document.getElementById('invoiceTime').innerText,
                name: document.getElementById('custName').value || 'N/A',
                phone: document.getElementById('custPhone').value || 'N/A',
                address: document.getElementById('custAddress').value || 'N/A',
                products: productListString,
                subtotal: document.getElementById('subTotal').innerText,
                discount: (parseFloat(document.getElementById('discountInput').value) || 0).toFixed(2),
                grandtotal: document.getElementById('grandTotal').innerText
            };

            // Fetch API এর মাধ্যমে রিকোয়েস্ট পাঠানো
            fetch(googleScriptURL, {
                method: 'POST',
                mode: 'no-cors', 
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("✅ চমৎকার! ডাটা সফলভাবে গুগল শিটে জমা হয়েছে।");
                forceClear(); // সাবমিট সফল হলে ফর্ম ও মেমো অটো ক্লিয়ার হবে
            })
            .catch(error => {
                console.error('Error:', error);
                alert("❌ দুঃখিত! ডাটা পাঠাতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "সাবমিট করুন";
                submitBtn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm transition duration-200 shadow-sm cursor-pointer text-center";
            });
        }
    </script>
</body>
</html>
